name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      load-test:
        description: "Lancer le test de charge k6"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, tests unitaires, couverture, contrats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint (ktlint, detekt)
        run: ./gradlew ktlintCheck detekt -Plint.strict=true --continue
      - name: Tests unitaires, ArchUnit et contrats d'événements
        run: ./gradlew test
      - name: Couverture (Kover, ≥ 80 % sur le domaine)
        run: ./gradlew koverVerify koverXmlReport
      - name: Tests de mutation du domaine (Pitest, ≥ 70 %)
        run: ./gradlew :modules:ledger:pitest
      - name: Les contrats d'événements sont à jour
        run: git diff --exit-code contracts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7

  integration:
    name: Tests d'intégration (Testcontainers + Debezium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:integrationTest -Pit.verbose > it.log 2>&1 || (grep -iE 'debezium|connector|outbox|kafka|ERROR|Exception|FAILED|tests completed' it.log | grep -vE '^\s+at ' | cut -c1-400 | head -300; exit 1)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-reports
          path: app/build/reports/tests/

  security:
    name: Analyse de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Vulnérabilités (Trivy, dépôt)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs /src \
            --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  image:
    name: Image Docker (Jib → GHCR)
    runs-on: ubuntu-latest
    needs: [build, integration, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:jib -Djib.to.auth.username=${{ github.actor }} -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Déploiement sur la VM de démo
    runs-on: ubuntu-latest
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    environment: demo
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd ~/pocketledger && git pull --ff-only && DOMAIN=${{ vars.DOMAIN }} ./ops/scripts/deploy.sh

  load:
    name: Test de charge (k6)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.load-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Démarrer la stack
        run: |
          ./gradlew :app:jibDockerBuild
          docker compose -f ops/docker-compose.yml --profile full up -d --wait
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: load-tests/k6/transactions.js
        env:
          BASE_URL: http://localhost:8080
