build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 16
  TooManyFunctions:
    thresholdInClasses: 25
    thresholdInFiles: 30
  LongMethod:
    threshold: 80
  CyclomaticComplexMethod:
    threshold: 20

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 160
  ReturnCount:
    max: 6
  ThrowsCount:
    max: 6
  ForbiddenComment:
    active: false

naming:
  FunctionNaming:
    excludes: ["**/test/**"]

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
