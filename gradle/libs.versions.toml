[versions]
kotlin = "2.2.20"
spring-boot = "3.5.6"
spring-dependency-management = "1.1.7"
springdoc = "2.8.9"
resilience4j = "2.3.0"
bouncycastle = "1.81"
kotest = "5.9.1"
mockk = "1.13.17"
archunit = "1.3.0"
debezium = "3.1.0.Final"
jsonschema-generator = "4.37.0"
kover = "0.9.1"
ktlint-gradle = "13.0.0"
detekt = "1.23.8"
jib = "3.4.5"
pitest-gradle = "1.15.0"

[libraries]
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
resilience4j-spring = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
debezium-testcontainers = { module = "io.debezium:debezium-testing-testcontainers", version.ref = "debezium" }
jsonschema-generator = { module = "com.github.victools:jsonschema-generator", version.ref = "jsonschema-generator" }
jsonschema-module-jackson = { module = "com.github.victools:jsonschema-module-jackson", version.ref = "jsonschema-generator" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-gradle" }
