# PocketLedger — stack locale et VM de démo.
#   docker compose -f ops/docker-compose.yml up -d                 → infrastructure (profil par défaut)
#   docker compose -f ops/docker-compose.yml --profile full up -d  → + application et observabilité
# L'image de l'application se construit avec : ./gradlew :app:jibDockerBuild

name: pocketledger

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=logical            # requis par Debezium (réplication logique)
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=2GB   # borne le WAL retenu si Debezium s'arrête
    environment:
      POSTGRES_DB: pocketledger
      POSTGRES_USER: pocketledger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pocketledger}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketledger -d pocketledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: pocketledger-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["full"]
    image: ${APP_IMAGE:-ghcr.io/pocketledger/pocketledger:latest}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      connect:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pocketledger
      DB_USER: pocketledger
      DB_PASSWORD: ${DB_PASSWORD:-pocketledger}
      KAFKA_BOOTSTRAP: kafka:19092
      REDIS_HOST: redis
      DEBEZIUM_CONNECT_URL: http://connect:8083
      DEBEZIUM_DB_HOST: postgres
      OTLP_TRACES_ENDPOINT: http://lgtm:4318/v1/traces
      OTLP_METRICS_ENABLED: "true"
      OTLP_METRICS_ENDPOINT: http://lgtm:4318/v1/metrics
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@pocketledger.dev}
      FX_PROVIDER_URL: ${FX_PROVIDER_URL:-}
      FX_PROVIDER_APP_ID: ${FX_PROVIDER_APP_ID:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Grafana + Prometheus + Tempo + Loki + collecteur OpenTelemetry dans une seule image.
  lgtm:
    profiles: ["full"]
    image: grafana/otel-lgtm:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data
      - ./grafana/pocketledger-dashboard.json:/otel-lgtm/pocketledger-dashboard.json:ro

volumes:
  postgres-data:
  kafka-data:
  lgtm-data:
